backend:
  name: github
  repo: rakib07022005-collab/personal-website
  branch: main
media_folder: uploads
public_folder: /uploads
collections:
  - name: posts
    label: Posts
    folder: content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: datetime}
      - {label: Category, name: category, widget: relation, collection: settings, file: categories, search_fields: ["categories.*.name"], value_field: "categories.*.name", display_fields: ["categories.*.name"]}
      - {label: Photo, name: image, widget: image, required: false}
      - {label: Text, name: body, widget: markdown, required: false}
  - name: settings
    label: Site settings
    files:
      - label: Categories
        name: categories
        file: categories.json
        fields:
          - label: Categories
            name: categories
            widget: list
            fields: [{label: Name, name: name, widget: string}]
      - label: Home numbers
        name: stats
        file: stats.json
        fields:
          - label: Numbers
            name: stats
            widget: list
            fields:
              - {label: Number, name: value, widget: number}
              - {label: Prefix (e.g. $), name: prefix, widget: string, required: false}
              - {label: Suffix (e.g. +), name: suffix, widget: string, required: false}
              - {label: Label, name: label, widget: string}
